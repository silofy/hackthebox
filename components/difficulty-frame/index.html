<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Difficulty Frames</title>
  <style>
    body { margin: 0; padding: 48px 16px; background: #111927; color: #fff; font: 500 20px/1.2 system-ui, sans-serif; }
    h2 { font-weight: 400; font-size: 22px; margin: 0 0 32px 80px; }
    .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin-bottom: 64px; }
    figure { margin: 0; display: grid; justify-items: center; gap: 24px; }
  </style>
  <script src="difficulty-frame.js" defer></script>
</head>
<body>
  <h2>4px - border</h2>
  <div class="row">
    <figure><htb-difficulty-frame difficulty="easy"   src="demo-art.png"></htb-difficulty-frame><figcaption>Easy</figcaption></figure>
    <figure><htb-difficulty-frame difficulty="medium" src="demo-art.png"></htb-difficulty-frame><figcaption>Medium</figcaption></figure>
    <figure><htb-difficulty-frame difficulty="hard"   src="demo-art.png"></htb-difficulty-frame><figcaption>Hard</figcaption></figure>
    <figure><htb-difficulty-frame difficulty="insane" src="demo-art.png"></htb-difficulty-frame><figcaption>Insane</figcaption></figure>
  </div>
  <h2>Circle - 4px border</h2>
  <div class="row">
    <figure><htb-difficulty-frame shape="circle" difficulty="easy"   src="demo-art.png"></htb-difficulty-frame><figcaption>Easy</figcaption></figure>
    <figure><htb-difficulty-frame shape="circle" difficulty="medium" src="demo-art.png"></htb-difficulty-frame><figcaption>Medium</figcaption></figure>
    <figure><htb-difficulty-frame shape="circle" difficulty="hard"   src="demo-art.png"></htb-difficulty-frame><figcaption>Hard</figcaption></figure>
    <figure><htb-difficulty-frame shape="circle" difficulty="insane" src="demo-art.png"></htb-difficulty-frame><figcaption>Insane</figcaption></figure>
  </div>
  <h2>Shield - 4px border</h2>
  <div class="row">
    <figure><htb-difficulty-frame shape="shield" difficulty="easy"   src="demo-art.png"></htb-difficulty-frame><figcaption>Easy</figcaption></figure>
    <figure><htb-difficulty-frame shape="shield" difficulty="medium" src="demo-art.png"></htb-difficulty-frame><figcaption>Medium</figcaption></figure>
    <figure><htb-difficulty-frame shape="shield" difficulty="hard"   src="demo-art.png"></htb-difficulty-frame><figcaption>Hard</figcaption></figure>
    <figure><htb-difficulty-frame shape="shield" difficulty="insane" src="demo-art.png"></htb-difficulty-frame><figcaption>Insane</figcaption></figure>
  </div>
  <h2>Small sizes (64px / 2px)</h2>
<div class="row">
    <htb-difficulty-frame shape="diamond" difficulty="easy"   src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="diamond" difficulty="medium" src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="diamond" difficulty="hard"   src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="diamond" difficulty="insane" src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
  </div>
<div class="row">
    <htb-difficulty-frame shape="circle" difficulty="easy"   src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="circle" difficulty="medium" src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="circle" difficulty="hard"   src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="circle" difficulty="insane" src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
  </div>
<div class="row">
    <htb-difficulty-frame shape="shield" difficulty="easy"   src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="shield" difficulty="medium" src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="shield" difficulty="hard"   src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
    <htb-difficulty-frame shape="shield" difficulty="insane" src="demo-art.png" size="64" stroke="2"></htb-difficulty-frame>
  </div>
</body>
</html>

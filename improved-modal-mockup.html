<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solve Modal — HTB</title>
<link rel="stylesheet" href="https://use.typekit.net/jxn7iyx.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
<style>
  :root{
    --brand-primary:#C5F566; --brand-primary-hover:#D4F98A; --brand-primary-dim:#C5F56620; --brand-primary-muted:#C5F56610;
    --surface-base:#0A0E17; --surface-panel:#141D2B; --surface-card:#1A2332; --surface-input:#111927; --surface-hover:#1E2A3A; --surface-active:#243044;
    --border-default:#1E2D40; --border-subtle:#162030; --border-hover:#2A3E58;
    --text-primary:#F4F4F4; --text-secondary:#8799B5; --text-muted:#6B7A94; --text-dim:#4A5568;
    --success:#C5F566; --error:#F35E5E; --warning:#F3CB5E; --info:#5E94F3; --vip:#B75EF3;
    --radius-sm:6px; --radius-md:8px; --radius-lg:10px; --radius-xl:14px; --radius-full:100px;
    --elevation-3:0 4px 16px rgba(0,0,0,0.4); --glow-green:0 0 8px rgba(159,239,0,0.25);
    --ease-enter:cubic-bezier(0,0,0.2,1);
    --font-sans:'neue-haas-unica',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
    --font-mono:'roboto-mono','SF Mono',Consolas,monospace;
    --modal-max-w:440px; --modal-vw:50vw; --modal-max-h:90vh;
  }
  @media (max-width:1024px){ :root{ --modal-vw:62vw; } }
  @media (max-width:768px){  :root{ --modal-vw:80vw; } }
  @media (max-width:600px){  :root{ --modal-vw:92vw; --modal-max-h:94vh; } }
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-sans);font-weight:500;-webkit-font-smoothing:antialiased;}
  body{background:var(--surface-base);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:48px 16px;min-height:100vh;overflow:auto;}
  .label{color:var(--text-muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase;}
  .material-symbols-rounded{font-family:'Material Symbols Rounded';font-weight:normal;line-height:1;display:inline-block;}

  /* ── Modal frame ── */
  .modal{position:relative;width:min(var(--modal-vw),var(--modal-max-w));max-height:var(--modal-max-h);
         display:flex;flex-direction:column;overflow:hidden;background:var(--surface-panel);
         border:1px solid var(--border-default);border-radius:var(--radius-xl);box-shadow:var(--elevation-3);animation:rise .3s var(--ease-enter) both;}
  @keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .close{position:absolute;top:12px;right:14px;z-index:3;color:var(--text-dim);cursor:pointer;background:none;border:none;display:flex;}
  .close .material-symbols-rounded{font-size:20px;}
  .close:hover{color:var(--text-secondary);}

  .screen{display:flex;flex-direction:column;min-height:0;animation:fade .25s var(--ease-enter) both;}
  .modal:not(.sharing) .screen.share{display:none;}
  .modal.sharing .screen.result{display:none;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ════ RESULT · hero ════ */
  .m-hero{position:relative;flex:0 0 auto;height:clamp(244px,42vh,300px);background:var(--surface-hover);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .m-hero .bg{position:absolute;inset:0;width:100%;height:100%;}
  .hero-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px;text-align:center;}
  .avatar{width:120px;height:120px;border-radius:var(--radius-full);overflow:hidden;
          background:radial-gradient(circle at 50% 38%,var(--surface-active),var(--surface-input));box-shadow:var(--glow-green),0 8px 24px rgba(0,0,0,.45);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;}
  .avatar img{width:100%;height:100%;object-fit:cover;}
  @keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
  .mname{font-size:24px;font-weight:500;letter-spacing:-0.01em;color:var(--text-primary);line-height:1.15;text-shadow:0 2px 10px rgba(0,0,0,.5);}
  .mspec{margin-top:6px;font-size:13px;color:var(--text-secondary);display:flex;justify-content:center;align-items:center;gap:7px;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .mspec .diff{color:var(--warning);}
  .mspec .os{display:inline-flex;align-items:center;gap:4px;}
  .mspec .os .material-symbols-rounded{font-size:15px;color:var(--text-muted);}
  .mspec .sep{color:var(--text-dim);}

  /* ════ RESULT · body ════ */
  .m-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:22px 28px 24px;text-align:center;scrollbar-width:thin;scrollbar-color:var(--border-default) transparent;}
  .m-body::-webkit-scrollbar,.s-body::-webkit-scrollbar{width:3px;}
  .m-body::-webkit-scrollbar-thumb,.s-body::-webkit-scrollbar-thumb{background:var(--border-default);border-radius:var(--radius-full);}

  .subtitle{margin-top:2px;color:var(--text-primary);font-size:16px;line-height:1.5;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;}
  .chip{display:inline-flex;align-items:center;gap:7px;border-radius:var(--radius-full);padding:3px 12px 3px 4px;font-size:16px;
        background:var(--surface-hover);color:var(--text-primary);border:1px solid var(--border-default);}
  .chip img{width:24px;height:24px;border-radius:var(--radius-full);object-fit:cover;}

  .reward{margin-top:20px;}
  .reward .xp{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:56px;line-height:1;font-weight:500;letter-spacing:-0.02em;color:var(--brand-primary);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(197,245,102,.3);}
  .reward .xp .xpicon{width:48px;height:48px;display:block;flex:0 0 auto;}
  .reward .rlbl{margin-top:5px;color:var(--text-muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;}

  .meta{margin-top:18px;padding-top:16px;border-top:1px solid var(--border-subtle);
        display:flex;align-items:center;justify-content:center;gap:12px;font-size:16px;color:var(--text-muted);}
  .meta .v{color:var(--text-primary);font-variant-numeric:tabular-nums;}
  .meta .k{margin-left:6px;font-size:14px;}
  .meta .sep{color:var(--text-dim);}
  .tag-state{display:inline-block;border-radius:var(--radius-full);padding:3px 10px;font-size:13px;background:var(--brand-primary-muted);color:var(--brand-primary);border:1px solid var(--brand-primary-dim);}

  .btn{width:100%;margin-top:24px;padding:13px;border:none;border-radius:var(--radius-md);font-family:var(--font-sans);font-size:14px;font-weight:500;cursor:pointer;background:var(--brand-primary);color:#111;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn .material-symbols-rounded{font-size:18px;}
  .btn:hover{background:var(--brand-primary-hover);}
  .btn:active{transform:scale(.98);}

  /* ════ SHARE composer ════ */
  .s-head{display:flex;align-items:center;gap:8px;padding:14px 14px 12px;border-bottom:1px solid var(--border-subtle);flex:0 0 auto;}
  .iconbtn{background:none;border:none;color:var(--text-muted);cursor:pointer;display:flex;padding:4px;border-radius:var(--radius-sm);}
  .iconbtn .material-symbols-rounded{font-size:22px;}
  .iconbtn:hover{color:var(--text-primary);background:var(--surface-hover);}
  .s-title{font-size:15px;color:var(--text-primary);}
  .s-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px;scrollbar-width:thin;scrollbar-color:var(--border-default) transparent;}
  .s-lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 9px;}

  /* ── enhanced OG card ── */
  .og{position:relative;aspect-ratio:1200/630;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-default);
      background:
        radial-gradient(90% 130% at 110% -10%, rgba(94,148,243,.22), transparent 55%),
        radial-gradient(80% 120% at -10% 110%, rgba(197,245,102,.20), transparent 55%),
        linear-gradient(160deg,#11192a,#0A0E17);}
  .og::before{content:"";position:absolute;inset:0;opacity:.5;
      background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:14px 14px;}
  .og .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--brand-primary),#79B500);}
  .og .inner{position:relative;height:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;padding:18px 20px 18px 22px;}
  .og .brand{display:flex;align-items:center;gap:7px;color:var(--text-secondary);font-size:10px;letter-spacing:.14em;text-transform:uppercase;}
  .og .brand svg{width:15px;height:15px;}
  .og .eyebrow{margin-top:11px;color:var(--brand-primary);font-size:10px;letter-spacing:.16em;text-transform:uppercase;}
  .og .name{margin-top:3px;font-size:26px;font-weight:500;color:#fff;letter-spacing:-0.01em;line-height:1;}
  .og .spec{margin-top:6px;font-size:11px;color:var(--text-secondary);}
  .og .spec .diff{color:var(--warning);}
  .og .stats{margin-top:14px;display:flex;gap:20px;}
  .og .stats .n{font-size:18px;color:#fff;font-variant-numeric:tabular-nums;line-height:1;}
  .og .stats .n.xp{color:var(--brand-primary);}
  .og .stats .t{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-top:3px;}
  .og .side{display:flex;flex-direction:column;align-items:center;gap:9px;}
  .og .side .pic{width:84px;height:84px;border-radius:var(--radius-full);overflow:hidden;box-shadow:var(--glow-green),0 6px 18px rgba(0,0,0,.5);}
  .og .side .pic img{width:100%;height:100%;object-fit:cover;}
  .og .side .user{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);}
  .og .side .user img{width:16px;height:16px;border-radius:var(--radius-full);object-fit:cover;}
  .og .url{position:absolute;left:22px;bottom:12px;font-size:9.5px;color:var(--text-dim);letter-spacing:.06em;}

  /* ── editable post field (hashtags inline) ── */
  .composer{margin-top:18px;position:relative;}
  .post{width:100%;min-height:110px;resize:vertical;background:var(--surface-input);border:1px solid var(--border-default);border-radius:var(--radius-md);
        padding:13px 14px;color:var(--text-primary);font-family:var(--font-sans);font-weight:400;font-size:14px;line-height:1.55;outline:none;transition:border-color .12s ease,box-shadow .12s ease;}
  .post:focus{border-color:var(--brand-primary);box-shadow:0 0 0 2px var(--brand-primary-dim);}
  .post::placeholder{color:var(--text-dim);}
  .ccount{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;}

  /* ── square icon-only social buttons ── */
  .socials{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;}
  .sbtn{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);
        border:1px solid var(--border-default);background:var(--surface-card);color:var(--text-secondary);cursor:pointer;transition:background .12s ease,border-color .12s ease,color .12s ease;}
  .sbtn:hover{background:var(--surface-hover);border-color:var(--border-hover);}
  .sbtn:active{transform:scale(.96);}
  .sbtn svg{width:20px;height:20px;fill:currentColor;}
  .sbtn .material-symbols-rounded{font-size:22px;}
  .sbtn.x:hover{color:#fff;} .sbtn.li:hover{color:#0A66C2;} .sbtn.fb:hover{color:#1877F2;}
  .sbtn.wa:hover{color:#25D366;} .sbtn.rd:hover{color:#FF4500;} .sbtn.copy:hover,.sbtn.dl:hover{color:var(--brand-primary);}

  @media (prefers-reduced-motion:reduce){ .modal,.avatar,.screen,.bg *{animation:none!important;} }
</style>
</head>

    const modal = document.getElementById('modal');
    document.getElementById('toShare').addEventListener('click', () => modal.classList.add('sharing'));
    document.getElementById('backBtn').addEventListener('click', () => modal.classList.remove('sharing'));

    const post = document.getElementById('postText');
    const ccount = document.getElementById('ccount');
    const sync = () => ccount.textContent = post.value.length + '/280';
    post.addEventListener('input', sync); sync();

    const pageUrl = 'https://www.hackthebox.com/';
    document.querySelectorAll('.sbtn').forEach(b => b.addEventListener('click', () => {
      const text = post.value, u = encodeURIComponent(pageUrl), t = encodeURIComponent(text);
      const map = {
        x: `https://twitter.com/intent/tweet?text=${t}`,
        linkedin: `https://www.linkedin.com/sharing/share-offsite/?url=${u}`,
        facebook: `https://www.facebook.com/sharer/sharer.php?u=${u}&quote=${t}`,
        reddit: `https://www.reddit.com/submit?url=${u}&title=${t}`,
        whatsapp: `https://wa.me/?text=${t}%20${u}`
      };
      const k = b.dataset.share;
      if (map[k]) window.open(map[k], '_blank', 'noopener,width=600,height=560');
      else if (k === 'copy') navigator.clipboard?.writeText(pageUrl);
      // 'download' would export the rendered OG image as PNG
    }));
  </script>
